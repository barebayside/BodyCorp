<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#243B2F">
<meta name="robots" content="noindex">
<title>Building portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<link rel="manifest" id="app-manifest">
<link rel="apple-touch-icon" id="app-touch-icon" href="icons/product-180.png">
<link rel="icon" type="image/png" sizes="32x32" id="app-favicon" href="icons/product-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" id="app-title" content="Portal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header class="top">
  <div class="strip">
    <div class="banner" id="banner" hidden><img id="banner-img" alt="" decoding="async"></div>
    <div class="wrap top-bar">
      <a class="brand-link" href="#/home">
        <img id="logo" alt="" hidden>
        <span id="bname">Building portal</span>
      </a>
      <span id="who"></span>
    </div>
  </div>
  <nav id="nav" class="wrap" aria-label="Main" hidden></nav>
</header>

<main id="view" class="wrap" tabindex="-1">
  <p class="muted loading">Loading…</p>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot-in">
      <span id="foot-line"></span><span id="foot-sep" hidden> · </span><span>Powered by <span class="product-name">BodyCorp</span></span>
    </div>
  </div>
</footer>

<script src="portal.js"></script>
</body>
</html>
